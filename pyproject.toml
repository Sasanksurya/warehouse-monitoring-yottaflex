[project]
name = "whmon"
version = "1.0.0"
description = "Synthetic warehouse environmental-monitoring data generator, rule engine, validator and evaluator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whmon*"]
